name: Function Deploy

on:
  push:
    branches:
      - main
    paths:
      - "Azure AI Solutions/AI Agents/azure-tenant-security-posture-agent/src/**"
      - "Azure AI Solutions/AI Agents/azure-tenant-security-posture-agent/.github/workflows/function-deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  FUNCTION_APP_DIR: Azure AI Solutions/AI Agents/azure-tenant-security-posture-agent/src

jobs:
  deploy-function:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ${{ env.FUNCTION_APP_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Deploy Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.FUNCTION_APP_NAME }}
          package: ${{ env.FUNCTION_APP_DIR }}
